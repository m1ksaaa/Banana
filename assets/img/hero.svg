<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none">
  <defs>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7cb7ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <ellipse cx="380" cy="150" rx="180" ry="150" fill="url(#glow1)"/>
  <ellipse cx="150" cy="270" rx="150" ry="90" fill="url(#glow2)"/>
  <!-- back glass panel -->
  <rect x="70" y="36" width="440" height="270" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".16"/>
  <g stroke="#ffffff" stroke-opacity=".07">
    <line x1="100" y1="96" x2="480" y2="96"/><line x1="100" y1="146" x2="480" y2="146"/>
    <line x1="100" y1="196" x2="480" y2="196"/><line x1="100" y1="246" x2="480" y2="246"/>
  </g>
  <!-- candlesticks -->
  <g stroke-linecap="round">
    <g stroke="#7cb7ff" stroke-opacity=".7"><line x1="128" y1="214" x2="128" y2="262"/><line x1="176" y1="196" x2="176" y2="250"/><line x1="224" y1="200" x2="224" y2="244"/><line x1="272" y1="170" x2="272" y2="226"/><line x1="320" y1="176" x2="320" y2="222"/><line x1="368" y1="132" x2="368" y2="196"/><line x1="416" y1="118" x2="416" y2="170"/><line x1="456" y1="90" x2="456" y2="146"/></g>
    <rect x="120" y="226" width="16" height="26" rx="3" fill="#3b82f6" fill-opacity=".75"/>
    <rect x="168" y="208" width="16" height="30" rx="3" fill="#3b82f6" fill-opacity=".75"/>
    <rect x="216" y="212" width="16" height="22" rx="3" fill="#e66767" fill-opacity=".75"/>
    <rect x="264" y="182" width="16" height="34" rx="3" fill="#3b82f6" fill-opacity=".8"/>
    <rect x="312" y="186" width="16" height="26" rx="3" fill="#e66767" fill-opacity=".75"/>
    <rect x="360" y="146" width="16" height="40" rx="3" fill="#3b82f6" fill-opacity=".85"/>
    <rect x="408" y="128" width="16" height="32" rx="3" fill="#3b82f6" fill-opacity=".9"/>
    <rect x="448" y="102" width="16" height="34" rx="3" fill="#3b82f6"/>
  </g>
  <!-- trend line -->
  <path d="M100 250 C150 236 170 214 210 216 S270 190 300 192 S350 150 380 152 S440 110 480 92 L480 300 L100 300 Z" fill="url(#area)" opacity=".55"/>
  <path d="M100 250 C150 236 170 214 210 216 S270 190 300 192 S350 150 380 152 S440 110 480 92" stroke="url(#line)" stroke-width="7" stroke-linecap="round" filter="url(#blur)" opacity=".7"/>
  <path d="M100 250 C150 236 170 214 210 216 S270 190 300 192 S350 150 380 152 S440 110 480 92" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="480" cy="92" r="7" fill="#7cb7ff"/><circle cx="480" cy="92" r="15" fill="#7cb7ff" fill-opacity=".25"/>
  <!-- floating score card -->
  <g transform="translate(30 70)">
    <rect width="150" height="96" rx="16" fill="#0b1630" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".18"/>
    <circle cx="42" cy="48" r="26" stroke="#ffffff" stroke-opacity=".12" stroke-width="7"/>
    <path d="M42 22 A26 26 0 1 1 18.6 59.3" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
    <rect x="80" y="30" width="54" height="8" rx="4" fill="#ffffff" fill-opacity=".35"/>
    <rect x="80" y="46" width="40" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
    <rect x="80" y="62" width="48" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
  </g>
  <!-- floating bar card -->
  <g transform="translate(400 222)">
    <rect width="140" height="100" rx="16" fill="#0b1630" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="18" y="20" width="70" height="7" rx="3.5" fill="#ffffff" fill-opacity=".3"/>
    <rect x="18" y="40" width="104" height="7" rx="3.5" fill="#ffffff" fill-opacity=".1"/><rect x="18" y="40" width="86" height="7" rx="3.5" fill="#22c55e"/>
    <rect x="18" y="58" width="104" height="7" rx="3.5" fill="#ffffff" fill-opacity=".1"/><rect x="18" y="58" width="60" height="7" rx="3.5" fill="#fab219"/>
    <rect x="18" y="76" width="104" height="7" rx="3.5" fill="#ffffff" fill-opacity=".1"/><rect x="18" y="76" width="94" height="7" rx="3.5" fill="#3b82f6"/>
  </g>
</svg>
