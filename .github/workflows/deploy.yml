# Weboldal közzététele GitHub Pages-en + heti adatfrissítés a SEC EDGAR-ból.
# - push a main ágra: tesztek, majd közzététel
# - hétfőnként és kézi indításkor (Actions → Run workflow): előbb letölti az összes NASDAQ cég adatait,
#   commitolja a data/ mappát, majd közzéteszi az oldalt.
name: Adatfrissítés és közzététel

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Csak ezek a tickerek (vesszővel elválasztva, üresen = mind)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tesztek
        run: npm test

      - name: Adatok frissítése (SEC EDGAR)
        if: github.event_name != 'push'
        env:
          # A SEC kéri, hogy a kérések azonosítsák a küldőt (név + e-mail). Állítsd be repository secretként.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            node scripts/update-data.mjs --tickers "${{ github.event.inputs.tickers }}"
          else
            node scripts/update-data.mjs
          fi

      - name: Frissített adatok mentése
        if: github.event_name != 'push'
        run: |
          git config user.name "terastockx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Adatfrissítés: $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
